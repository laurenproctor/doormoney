# The gate every change goes through: lint, types, unit tests, production build, from a clean
# checkout on the Node version .nvmrc names.
#
# The second job is the Phase 1 security gate: every migration and the seed applied to a throwaway
# Postgres, then supabase/tests/permissions_test.sql. It runs here because the suite existed for a
# while without CI running it, and migration 0022 reached production with a hole in it.
#
# This workflow takes no secrets, on purpose. The app is built to run without them (sample data,
# pretend forms), so a build here can never reach Supabase, Stripe or Resend. The two values below
# are obvious CI-only placeholders. The database job talks only to a container it starts itself.
# If a future change makes the build need a real credential, fix the build, do not add a secret
# to this file.

name: Verify

on:
  pull_request:
  push:
    branches: [main]

# One run per branch. A new push supersedes the one still going.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Not a real origin. Only sets absolute links in the build output.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Check out the commit
        uses: actions/checkout@v5

      - name: Install the Node version .nvmrc names
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` deletes node_modules and installs strictly from the lockfile, so a lockfile that
      # has drifted from package.json fails here rather than in production.
      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs `next typegen` first: the generated route and layout types do not exist in a fresh
      # checkout, and tsc fails without them.
      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  database:
    name: Database permissions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the commit
        uses: actions/checkout@v5

      # Starts its own postgres container, installs pgTAP, applies supabase/tests/bootstrap.sql,
      # every migration in order and the seed, then runs the suite. The script fails on a plan that
      # does not match the assertions that ran, so a file that aborts early cannot report green.
      - name: Data API permissions
        run: npm run test:db:docker
